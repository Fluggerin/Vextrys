<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vextrys Production</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            animation: fadeInAll 1.2s ease forwards;
        }

        .container { 
            width: 100%; 
            max-width: 900px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-logo { 
            width: 350px;
            max-width: 90%;
            height: auto; 
            margin-bottom: 40px;
            display: block;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .btn {
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .btn i, .btn svg { margin-right: 12px; width: 20px; text-align: center; }
        .x-icon { fill: white; width: 18px; height: 18px; }

        @keyframes fadeInAll {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 650px) {
            .links { flex-direction: row; }
            .btn { flex: 1; }
            .btn:hover { background: #1a1a1a; transform: translateY(-3px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" alt="Vextrys" class="main-logo">

        <div class="links">
            <a href="https://t.me/Vextrys" target="_blank" class="btn">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>
            <a href="https://x.com/VextrysWallet" target="_blank" class="btn">
                <svg class="x-icon" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                Twitter / X
            </a>
            <a href="https://github.com/Fluggerin/Vextrys" target="_blank" class="btn">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
    </div>

</body>
</html>
