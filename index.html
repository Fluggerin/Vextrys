<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>Vextrys Production</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body {
            background: linear-gradient(#ffffff, #ffffff) !important;
            background-color: #ffffff !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            animation: fadeInPage 1.5s ease forwards;
        }

        .container {
            width: 100% !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-logo {
            width: 93px;
            max-width: 90%;
            height: auto;
            margin-bottom: 40px;
            display: block;
            animation: slideUp 1.2s ease-out forwards;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 1.2s ease-out 0.3s backwards;
        }

        .btn {
            background: #000000 !important;
            color: #ffffff !important;
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, background 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .btn i, .btn svg { margin-right: 12px; width: 20px; flex-shrink: 0; }
        .x-icon { fill: white; width: 18px; height: 18px; }

        .btn:active { transform: scale(0.95); }

        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 768px) {
            .main-logo {
                width: 130px;
            }

            .links { flex-direction: row; max-width: 750px; }
            .btn { flex: 1; }
            .btn:hover { transform: translateY(-3px); background: #1a1a1a !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo1.jpg" alt="Vextrys" class="main-logo">
        <div class="links">
            <a href="https://t.me/Vextrys" target="_blank" class="btn">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>
            <a href="https://x.com/VextrysWallet" target="_blank" class="btn">
                <svg class="x-icon" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                Twitter / X
            </a>
            <a href="https://github.com/Fluggerin/Vextrys" target="_blank" class="btn">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
    </div>
</body>
</html>
